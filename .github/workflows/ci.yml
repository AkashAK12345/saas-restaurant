name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API — lint, build, unit, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/samco_test?schema=public
      ACCESS_TOKEN_SECRET: ci-only-not-a-real-secret
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN_DAYS: '7'
      REFRESH_TOKEN_ABSOLUTE_DAYS: '30'
      PORT: '3001'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      # migrate deploy also installs the audit_logs append-only triggers.
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/database

      # E2E fixtures build roles from the system permission catalogue, so the
      # seed is a prerequisite, not an optional step.
      - name: Seed system permissions
        run: npx prisma db seed
        working-directory: packages/database

      - name: Lint
        run: npm run lint --workspace api

      - name: Build
        run: npm run build --workspace api

      - name: Unit tests
        run: npm test --workspace api

      - name: E2E tests
        run: npm run test:e2e --workspace api
